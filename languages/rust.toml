# Rust solutions: the runner writes typed glue (src/main.rs and friends) from the pack's ## Signature and
# builds once per run, in release mode, offline. Format: docs/languages.md.
id         = "rust"
name       = "Rust 1.70+"
solution   = "src/solution.rs"
glue       = "rust"                   # stub, src/main.rs, src/mi_json.rs and src/mi_types.rs
detect     = ["cargo", "--version"]
build      = ["cargo", "build", "--release", "--offline", "--quiet", "--target-dir", "{build}"]
bin        = "{build}/release/mi_solution"
run        = ["{bin}", "{result}"]
env_pass   = ["CARGO_HOME", "RUSTUP_HOME", "RUSTUP_TOOLCHAIN", "RUSTFLAGS"]
deps_check = "cargo"

[scaffold]
"Cargo.toml" = """
[package]
name = "mi_solution"
version = "0.1.0"
edition = "2021"

[dependencies]
"""
