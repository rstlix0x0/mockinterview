# JavaScript solutions run on Bun or Node, whichever is found first. Format: docs/languages.md.
id          = "javascript"
name        = "JavaScript (Bun or Node 18+)"
solution    = "solution.js"
shim        = "shims/js_shim.mjs"
naming      = "camel"                 # two_sum -> twoSum, get_min -> getMin
call        = "positional"            # arguments in the order of the pack's stub
deps_check  = "npm"
stub_func   = """
function {entry}({params}) {
}

module.exports = { {entry} };
"""
stub_ops    = """
class {entry} {
  constructor({params}) {
  }
{methods}}

module.exports = { {entry} };
"""
stub_method = """

  {name}({params}) {
  }
"""

[[runtimes]]
id     = "bun"
detect = ["bun", "--version"]
run    = ["bun", "--no-install", "{shim}", "{solution}", "{result}"]

[[runtimes]]
id     = "node"
detect = ["node", "--version"]
run    = ["node", "{shim}", "{solution}", "{result}"]
